activity:
  id: paper_cutting
  name: 趣味剪纸

  objects:
    - id: paper
      name_cn: 纸张
      prompts:
        - paper
        - white paper sheet
        - colored paper
      conf: 0.05
    - id: scissors
      name_cn: 剪刀
      prompts:
        - scissors
        - safety scissors      # 儿童圆头剪刀，形状和普通剪刀差异大，值得单挂
      conf: 0.08
    - id: pencil
      name_cn: 铅笔
      prompts:
        - pencil
        - drawing pencil
      conf: 0.08

  steps:
    - id: 1
      name: 拿纸
    - id: 2
      name: 拿剪刀
    - id: 3
      name: 沿线剪
    - id: 4
      name: 完成