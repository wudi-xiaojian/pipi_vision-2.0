activity:
  id: paper_cup_building
  name: 神奇的纸杯搭建

  objects:
    - id: paper_cup
      name: 纸杯
      prompts:
        - paper cup
        - white paper cup
        - stacked paper cups
      conf: 0.5

  # 这里只保留 ActivityEngine 所需的通用时序参数。
  # STACKED / STRUCTURE_OK / STEP_COMPLETED / ACTIVITY_COMPLETED
  # 等活动语义不在这里定义，由 Activity Understanding / VLM 负责。
  engine:
    hand_near_distance_px: 120
    moving_speed_px_s: 45
    stopped_speed_px_s: 18
    persistence_ms: 250
    event_cooldown_ms: 450

  steps:
    - 拿起纸杯
    - 移动纸杯
    - 放置纸杯
    - 堆叠纸杯
    - 完成搭建
