activity:
  id: paper_cup_building
  name: 神奇的纸杯搭建

  objects:
    - id: paper_cup
      name: 纸杯
      prompts:
        - paper cup
        - white paper cup
        - stacked paper cups
      conf: 0.5

  engine:
    # Activity Engine 的通用时序参数；视觉层仍可按需要更高频运行。
    hand_near_distance_px: 120
    moving_speed_px_s: 45
    stopped_speed_px_s: 18
    persistence_ms: 250
    event_cooldown_ms: 450
    stack_vertical_gap_px: 45
    stack_horizontal_ratio: 0.65

  completion:
    # 第一版只做“稳定结构”基础判断，后续可加入结构形状/高度等规则。
    min_stacked_objects: 3

  steps:
    - 拿起纸杯
    - 移动纸杯
    - 放置纸杯
    - 堆叠纸杯
    - 完成搭建
